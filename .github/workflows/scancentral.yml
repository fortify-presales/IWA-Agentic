
# Create GitHub Action Repository Variables for your version of the application:
#   SSC_URL                     - SSC Server URL for your instance (e.g. https://ssc.example.com/ssc)
#   SSC_DEFAULT_ISSUE_TEMPLATE  - The default issue template to use when creating application versions
#   AVIATOR_URL                 - Aviator service URL for automated audit/remediation suggestions
# Create GitHub Action Secrets for your version of the application:
#   SSC_TOKEN should be an SSC authentication token with permissions to create/update application versions.
#   SC_SAST_TOKEN should be a ScanCentral SAST client authentication token.
#   AVIATOR_TOKEN should be the token used to authenticate against the Aviator service.
#   OPENAI_API_KEY is used by the optional FAA-Scan job (differential FAA on risky PRs).
# Optional risk-based FAA (see specs/020-faa-risk-pilot/README.md):
#   FAA_LICENSE_PLATFORM - set to "ssc" to run the FAA jobs here instead of in fod.yml.
# Helpful hints:
#   DO_AVIATOR_REMEDIATIONS only runs on the demo/fortify-remediate-ssc branch; DO_AVIATOR_AUDIT runs otherwise.
#   COPY_FROM_RELEASE seeds new application versions from the default branch's existing results.
#   SC_CLIENT_VERSION pins the ScanCentral Client version to match your sensor pool (e.g. "26.3"); defaults to "auto".
name: Fortify ScanCentral Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    # Full application scans are unnecessary for documentation or unrelated CI changes.
    paths:
      - 'packages/**'
      - '!packages/**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.npmrc'
      - 'debricked-config.yaml'
      - '.github/workflows/scancentral.yml'
      - '.github/custom-actions/ssc/**'
  push:
    branches: [ "main", "demo/fortify-remediate-ssc" ]
    paths:
      - 'packages/**'
      - '!packages/**/*.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.npmrc'
      - 'debricked-config.yaml'
      - '.github/workflows/scancentral.yml'
      - '.github/custom-actions/ssc/**'

jobs:
  Fortify-AST-Scan:
    runs-on: ubuntu-latest
    env:
      NEXUS_REPO_NPM: ${{ vars.NEXUS_REPO_NPM || 'https://registry.npmjs.org/' }}
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - name: Recreate ScanCentral source path
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/Src"
          ln -s "${GITHUB_WORKSPACE}/packages" "${GITHUB_WORKSPACE}/Src/packages"
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global push.autoSetupRemote true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install and Build
        run: |
          npm ci
          npm run clean
          npm run build
        env:
          NEXUS_REPO_AUTH: ${{ secrets.NEXUS_REPO_AUTH }}
      - name: Remove dependency Composer manifests
        run: find ./node_modules ./packages -type f -path '*/node_modules/*/composer.json' -print -delete
      # Perform FortifyScanCentral SAST/SCA/DAST scan and import results into GitHub code scanning alerts
      - name: Run ScanCentral Scan
        uses: fortify/github-action@v3
        env:
          SSC_URL: ${{ vars.SSC_URL }}
          SSC_TOKEN: ${{secrets.SSC_TOKEN}}
          SC_SAST_TOKEN: ${{secrets.SC_SAST_TOKEN}}
          # Pin to your ScanCentral SAST sensor's version so package format matches (default is "auto")
          #SC_CLIENT_VERSION: ${{ vars.SC_CLIENT_VERSION }}
          DO_SETUP: true
          SETUP_EXTRA_OPTS: ${{ format('--issue-template {0}', vars.SSC_DEFAULT_ISSUE_TEMPLATE) }}
          PACKAGE_EXTRA_OPTS: >-
            -bt none
            -skipBuild
            -exclude "DEMO.md"
            -exclude "SECURITY.md"
            -exclude "README.md"
            -exclude "**/tests/**/*"
            -exclude "build/**/*"
            -exclude "dist/**/*"
            -exclude "**/node_modules/**/package-lock.json"
            -exclude "**/node_modules/**/yarn.lock"
            -exclude "data"
            -exclude "logs"
          SAST_WAIT_EXTRA_OPTS: --timeout 3h
          DO_SAST_SCAN: true
          DO_DEBRICKED_SCAN: ${{ secrets.DEBRICKED_TOKEN != '' }}
          DEBRICKED_ACCESS_TOKEN: ${{secrets.DEBRICKED_TOKEN}}
          AVIATOR_URL: ${{ vars.AVIATOR_URL }}
          AVIATOR_TOKEN: ${{ secrets.AVIATOR_TOKEN }}
          AVIATOR_APP: ${{ github.repository }}
          DO_AVIATOR_AUDIT: ${{ vars.AVIATOR_URL != '' }}
          DO_AVIATOR_REMEDIATIONS: ${{ github.ref_name == 'demo/fortify-remediate-ssc' }}
          COPY_FROM_RELEASE: "${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.event.repository.default_branch }}"
          DO_DAST_SCAN: ${{ vars.DAST_SETTINGS != '' }}
          DAST_SETTINGS: ${{ vars.DAST_SETTINGS }}
          DO_WAIT: true
          DO_APPVERSION_SUMMARY: true
          DO_CHECK_POLICY: true
          DO_JOB_SUMMARY: true
          DO_PR_COMMENT: true
          DO_EXPORT: true
          # Use an absolute path (relative paths are resolved against fcli's cwd, not GITHUB_WORKSPACE)
          CHECK_POLICY_ACTION: ${{ github.workspace }}/.github/custom-actions/ssc/check-policy.yaml
          CHECK_POLICY_EXTRA_OPTS: --on-unsigned=ignore

  # Risk-based FAA: score the PR, then run a differential FAA scan only after the
  # SAST job above has set up the branch application version and produced SAST context.
  FAA-Risk:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      vars.FAA_LICENSE_PLATFORM == 'ssc'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      do_faa: ${{ steps.risk.outputs.do_faa }}
      change_range: ${{ steps.risk.outputs.change_range }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test risk criteria
        run: node --test .github/tests/faa-risk-adapter.test.mjs
      - name: Assess PR risk
        id: risk
        env:
          OUTPUT_DIR: ${{ runner.temp }}/faa-risk
        run: node .github/scripts/faa-risk-adapter.mjs --source "$GITHUB_WORKSPACE" --policy .github/faa-policy.json --output "$OUTPUT_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: faa-risk-ssc-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/faa-risk
          if-no-files-found: error
          retention-days: 14

  FAA-Scan:
    needs: [Fortify-AST-Scan, FAA-Risk]
    if: >-
      needs.FAA-Risk.outputs.do_faa == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fortify, faa]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up fcli
        uses: fortify/github-action/setup@v3
        with:
          fcli: bootstrapped
        env:
          FCLI_BOOTSTRAP_VERSION: v3.30.0
      - name: Run differential FAA and import results
        shell: bash
        env:
          FAA_PR_NUMBER: ${{ github.event.pull_request.number }}
          FAA_CHANGE_RANGE: ${{ needs.FAA-Risk.outputs.change_range }}
          SOURCE_DIR: ${{ github.workspace }}
          # Same application version the SAST job set up (fcli ci default: <repository>:<branch>)
          SSC_APPVERSION: ${{ format('{0}:{1}', github.repository, github.head_ref) }}
          FCLI_DEFAULT_SSC_URL: ${{ vars.SSC_URL }}
          FCLI_DEFAULT_SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          session_opt="--ssc-session=faa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fcli ssc session login "$session_opt"
          trap 'fcli ssc session logout "$session_opt"' EXIT
          mkdir -p "$RUNNER_TEMP/faa-output"
          fcli ssc action run "$GITHUB_WORKSPACE/.github/custom-actions/ssc/faa-scan.yaml" \
            "$session_opt" --on-unsigned=ignore --output "$RUNNER_TEMP/faa-output/faa.sarif"
          cat "$RUNNER_TEMP/faa-output/faa.sarif.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faa-scan-ssc-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/faa-output/faa.sarif
            ${{ runner.temp }}/faa-output/faa.sarif.md
          if-no-files-found: warn
          retention-days: 14
