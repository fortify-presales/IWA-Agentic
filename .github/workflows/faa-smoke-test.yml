name: FAA Differential Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Earlier ancestor SHA (40 hex characters); blank uses the dispatched commit's first parent
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: faa-smoke-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate trusted dispatch and smoke-test helper
    runs-on: ubuntu-latest
    steps:
      - name: Require this repository and an approved branch
        shell: bash
        run: |
          if [[ "$GITHUB_REPOSITORY" != "fortify-presales/IWA-Agentic" ||
                ( "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/heads/feature/020-faa-risk-pilot" ) ]]; then
            echo "::error::Dispatch from main or feature/020-faa-risk-pilot in fortify-presales/IWA-Agentic only."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test without invoking FAA
        run: node --test .github/tests/faa-smoke-test.test.mjs

  scan:
    name: FAA change-driven scan only
    needs: validate
    if: github.repository == 'fortify-presales/IWA-Agentic' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/020-faa-risk-pilot')
    runs-on: [self-hosted, Linux, X64, fortify, faa]
    timeout-minutes: 60
    env:
      FAA_BASE_SHA: ${{ inputs.base_sha }}
      FAA_LICENSE_PLATFORM: ${{ vars.FAA_LICENSE_PLATFORM || 'fod' }}
    steps:
      - name: Check out the exact dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run FAA differential analysis
        id: faa
        env:
          FAA_OUTPUT_DIR: ${{ runner.temp }}/faa-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          # The helper removes the unselected namespace before every FAA invocation.
          FCLI_DEFAULT_FOD_URL: ${{ env.FAA_LICENSE_PLATFORM == 'fod' && vars.FOD_URL || '' }}
          FCLI_DEFAULT_FOD_CLIENT_ID: ${{ env.FAA_LICENSE_PLATFORM == 'fod' && secrets.FOD_CLIENT_ID || '' }}
          FCLI_DEFAULT_FOD_CLIENT_SECRET: ${{ env.FAA_LICENSE_PLATFORM == 'fod' && secrets.FOD_CLIENT_SECRET || '' }}
          FCLI_DEFAULT_SSC_URL: ${{ env.FAA_LICENSE_PLATFORM == 'ssc' && vars.SSC_URL || '' }}
          FCLI_DEFAULT_SSC_TOKEN: ${{ env.FAA_LICENSE_PLATFORM == 'ssc' && secrets.SSC_TOKEN || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node .github/scripts/faa-smoke-test.mjs
      - name: Retain scan outputs and execution record
        if: always() && steps.faa.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: faa-smoke-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/faa-smoke-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
