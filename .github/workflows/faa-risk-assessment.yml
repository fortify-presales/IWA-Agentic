name: FAA Risk Assessment (Audit)

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faa-risk-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test trusted FAA scorer (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test .github/tests/faa-risk-adapter.test.mjs .github/tests/faa-smoke-test.test.mjs .github/tests/faa-pr-scan.test.mjs

  assess:
    name: Assess PR risk (not an FAA scan)
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    needs: test
    runs-on: ubuntu-latest
    outputs:
      score: ${{ steps.risk.outputs.score }}
      mandatory: ${{ steps.risk.outputs.mandatory }}
      decision: ${{ steps.risk.outputs.decision }}
      execute_faa: ${{ steps.risk.outputs.execute_faa }}
    steps:
      - name: Check out trusted base controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: controls
          persist-credentials: false
      - name: Check out PR source as data only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assess using trusted Node module and policy
        id: risk
        env:
          FAA_TRUSTED_CONTROL_SHA: ${{ github.event.pull_request.base.sha }}
          FAA_OUTPUT_DIR: ${{ runner.temp }}/faa-risk
          FAA_PR_SCANS_ENABLED: ${{ vars.FAA_PR_SCANS_ENABLED || 'false' }}
        run: node controls/.github/scripts/faa-risk-adapter.mjs --source source --output "$FAA_OUTPUT_DIR"
      - name: Retain assessment evidence
        uses: actions/upload-artifact@v4
        with:
          name: faa-risk-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/faa-risk/
          if-no-files-found: error
          retention-days: 14

  scan:
    name: FAA mandatory PR scan (audit only)
    needs: assess
    if: >-
      github.event_name == 'pull_request_target' &&
      needs.assess.outputs.execute_faa == 'true' &&
      github.repository == 'fortify-presales/IWA-Agentic' &&
      github.event.pull_request.head.repo.id == github.event.repository.id
    runs-on: [self-hosted, Linux, X64, fortify, faa]
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    env:
      FAA_PR_SCANS_ENABLED: ${{ vars.FAA_PR_SCANS_ENABLED || 'false' }}
      FAA_TRUSTED_CONTROL_SHA: ${{ github.event.pull_request.base.sha }}
      FAA_LICENSE_PLATFORM: ${{ vars.FAA_LICENSE_PLATFORM || 'fod' }}
    steps:
      - name: Check out immutable base controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: controls
          persist-credentials: false
      - name: Check out exact PR head as scan data only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run trusted PR scan helper
        id: faa
        env:
          FAA_GITHUB_TOKEN: ${{ github.token }}
          FAA_SOURCE_DIR: ${{ github.workspace }}/source
          FAA_OUTPUT_DIR: ${{ runner.temp }}/faa-pr-${{ github.run_id }}-${{ github.run_attempt }}
          FCLI_DEFAULT_FOD_URL: ${{ env.FAA_LICENSE_PLATFORM == 'fod' && vars.FOD_URL || '' }}
          FCLI_DEFAULT_FOD_CLIENT_ID: ${{ env.FAA_LICENSE_PLATFORM == 'fod' && secrets.FOD_CLIENT_ID || '' }}
          FCLI_DEFAULT_FOD_CLIENT_SECRET: ${{ env.FAA_LICENSE_PLATFORM == 'fod' && secrets.FOD_CLIENT_SECRET || '' }}
          FCLI_DEFAULT_SSC_URL: ${{ env.FAA_LICENSE_PLATFORM == 'ssc' && vars.SSC_URL || '' }}
          FCLI_DEFAULT_SSC_TOKEN: ${{ env.FAA_LICENSE_PLATFORM == 'ssc' && secrets.SSC_TOKEN || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node controls/.github/scripts/faa-pr-scan.mjs
      - name: Retain scan and execution evidence
        if: always() && steps.faa.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: faa-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/faa-pr-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 14
