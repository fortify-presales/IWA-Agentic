name: FAA PR risk and scan

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  group: faa-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk:
    if: github.event.pull_request.state == 'open' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      do_faa: ${{ steps.risk.outputs.do_faa }}
      change_range: ${{ steps.risk.outputs.change_range }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test risk criteria
        run: node --test .github/tests/faa-risk-adapter.test.mjs
      - name: Assess PR risk
        id: risk
        env:
          OUTPUT_DIR: ${{ runner.temp }}/faa-risk
        run: node .github/scripts/faa-risk-adapter.mjs --source "$GITHUB_WORKSPACE" --policy .github/faa-policy.json --output "$OUTPUT_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: faa-risk-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/faa-risk
          if-no-files-found: error
          retention-days: 14

  scan:
    needs: risk
    if: >-
      needs.risk.outputs.do_faa == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fortify, faa]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up fcli
        uses: fortify/github-action/setup@v3
        with:
          fcli: bootstrapped
        env:
          FCLI_BOOTSTRAP_VERSION: v3.30.0
      - name: Run differential FAA and import results
        shell: bash
        env:
          FAA_LICENSE_PLATFORM: ${{ vars.FAA_LICENSE_PLATFORM || 'fod' }}
          FAA_PR_NUMBER: ${{ github.event.pull_request.number }}
          FAA_CHANGE_RANGE: ${{ needs.risk.outputs.change_range }}
          SOURCE_DIR: ${{ github.workspace }}
          FOD_RELEASE: ${{ format('{0}:{1}', github.repository, github.head_ref) }}
          SSC_APPVERSION: ${{ format('{0}:{1}', github.repository, github.head_ref) }}
          COPY_FROM_RELEASE: ${{ format('{0}:{1}', github.repository, github.event.repository.default_branch) }}
          FOD_DEFAULT_OWNER: ${{ vars.FOD_DEFAULT_OWNER }}
          FCLI_DEFAULT_FOD_URL: ${{ vars.FOD_URL }}
          FCLI_DEFAULT_FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FCLI_DEFAULT_FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
          FCLI_DEFAULT_SSC_URL: ${{ vars.SSC_URL }}
          FCLI_DEFAULT_SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          case "$FAA_LICENSE_PLATFORM" in
            fod) for name in ${!FCLI_DEFAULT_SSC_@}; do unset "$name"; done ;;
            ssc) for name in ${!FCLI_DEFAULT_FOD_@}; do unset "$name"; done ;;
            *) echo "::error::FAA_LICENSE_PLATFORM must be fod or ssc"; exit 1 ;;
          esac
          session_opt="--${FAA_LICENSE_PLATFORM}-session=faa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fcli "$FAA_LICENSE_PLATFORM" session login "$session_opt"
          trap 'fcli "$FAA_LICENSE_PLATFORM" session logout "$session_opt"' EXIT
          if [[ "$FAA_LICENSE_PLATFORM" == fod ]]; then
            owner_opts=()
            if [[ -n "$FOD_DEFAULT_OWNER" ]]; then owner_opts=(--app-owner "$FOD_DEFAULT_OWNER"); fi
            fcli fod action run setup-release "$session_opt" --rel "$FOD_RELEASE" \
              --copy-from "$COPY_FROM_RELEASE" "${owner_opts[@]}"
          else
            fcli ssc action run setup-appversion "$session_opt" --av "$SSC_APPVERSION" \
              --copy-from "$COPY_FROM_RELEASE"
          fi
          mkdir -p "$RUNNER_TEMP/faa-output"
          fcli "$FAA_LICENSE_PLATFORM" action run \
            "$GITHUB_WORKSPACE/.github/custom-actions/$FAA_LICENSE_PLATFORM/faa-scan.yaml" \
            "$session_opt" --on-unsigned=ignore --output "$RUNNER_TEMP/faa-output/faa.sarif"
          cat "$RUNNER_TEMP/faa-output/faa.sarif.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faa-scan-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/faa-output/faa.sarif
            ${{ runner.temp }}/faa-output/faa.sarif.md
          if-no-files-found: warn
          retention-days: 14
