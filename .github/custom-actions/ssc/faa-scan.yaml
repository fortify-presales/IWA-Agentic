# yaml-language-server: $schema=https://fortify.github.io/fcli/schemas/action/fcli-action-schema-2.10.0.json

author: Fortify
usage:
  header: Run a scoped or PR differential Fortify Agentic Analyzer scan
  description: |
    This action scans all files selected by --scope, or runs a PR differential scan
    when --pr-number and --change-range are supplied together. In differential mode,
    --scope optionally narrows the changed files further. Without a change range,
    an explicit scope is required. There is no arbitrary scan-options passthrough.
    SARIF results are uploaded to the specified SSC application version.

    An optional --baseline SARIF preserves FAA finding instance IDs across runs.
    It is independent of the Git differential and existing Fortify findings.
    
    FAA obtains the existing findings for the specified SSC application version directly
    from SSC (--ssc-appversion) and uses them as complementary-analysis context, so that
    issues already identified by Fortify SAST are not reported as new FAA findings. No
    FPR is downloaded or processed locally.

    NOTE: FAA uses the findings available in SSC at the time this action runs. This action
    does not start or wait for a new SAST scan.

config:
  output: immediate
  rest.target.default: ssc
  run.fcli.status.log.default: true
  run.fcli.status.check.default: true
  mcp: exclude # FAA is a specialized tool requiring specific setup

cli.options:
  sourceDir:
    names: --source-dir, -d
    description: >-
      Source directory on which to run Fortify Agentic Analyzer scan.
      Defaults to environment variable `SOURCE_DIR` if not specified.
    default: ${#env('SOURCE_DIR')}
    required: true
  prNumber:
    names: --pr-number
    description: PR number; required with --change-range, otherwise omit both.
    required: false
    default: ${#env('FAA_PR_NUMBER')}
  changeRange:
    names: --change-range
    description: Optional merge-base..head range using two full Git commit SHAs; requires --pr-number.
    required: false
    default: ${#env('FAA_CHANGE_RANGE')}
  appVersion:
    names: --app-version, --av
    description: >-
      SSC application version from which FAA obtains existing findings and to which FAA
      scan results are uploaded.
      Application version must already exist in SSC.
    required: true
    default: ${#env('SSC_APPVERSION')?:#env('APP_VERSION')}
  scope:
    names: --scope
    description: >-
      Comma-separated files or directories to scan. Required without --change-range;
      otherwise optionally narrows the differential scan. Defaults to FAA_SCOPE.
    required: false
    default: ${#env('FAA_SCOPE')}
  baseline:
    names: --baseline
    description: Optional previous FAA SARIF; defaults to FAA_PREVIOUS_SARIF.
    required: false
    default: ${#env('FAA_PREVIOUS_SARIF')}
  faaOutput:
    names: --output, -o
    description: >-
      Output SARIF file path where FAA scan results will be written.
      Defaults to fortifyaa-scan.sarif in the current working directory.
    required: false 
    default: fortifyaa-scan.sarif
  faaPath:
    names: --faa-path, -p
    description: >-
      Path to a pre-installed Fortify Agentic Analyzer (FAA) installation. 
      FAA must be pre-installed on the system before running this action; 
      this action only registers the existing installation with fcli.
      Defaults to the FAA_HOME environment variable.
      If not specified and FAA_HOME is not set, the system PATH will be searched.
    required: false
    default: ${#env('FAA_HOME')}
  skipWait:
    names: --skip-wait
    description: >-
      By default, the action will wait for the uploaded SARIF artifact to be processed by SSC. Use this
      option to skip waiting for artifact processing to complete.
    required: false 
    type: boolean

steps:
  - if: ${#isNotBlank(cli.changeRange) && (#isBlank(cli.prNumber) || !cli.prNumber.matches('[1-9][0-9]*'))}
    throw: A positive PR number is required with --change-range.
  - if: >-
      ${#isNotBlank(cli.prNumber) && #isBlank(cli.changeRange)}
    throw: A change range is required with --pr-number; omit both for a scope-only scan.
  - if: ${#isNotBlank(cli.changeRange) && (!cli.changeRange.matches('[a-f0-9]{40}[.]{2}[a-f0-9]{40}') || cli.changeRange.substring(0,40)==cli.changeRange.substring(42))}
    throw: A nonempty merge-base..head range with two full commit SHAs is required.
  - if: >-
      ${#isBlank(cli.changeRange) && #isBlank(cli.scope)}
    throw: An explicit --scope is required without --change-range.
  - var.set:
      # fcli variable storing the uploaded artifact, used for waiting for artifact processing
      faaArtifactVarName: faa_scan_${#action.runID().replace('-','_')}
  
  - run.fcli:
      SETUP_TOOLS: 
        cmd: >-
          fcli tool env init --preinstalled "--tools=fortifyaa${#isNotBlank(cli.faaPath) ? ':' + cli.faaPath : ''}"
  
  # Run FAA using existing SSC findings as complementary context
  - run.fcli:
      RUN_FAA_SCAN:
        cmd: >
          fcli tool fortifyaa run --workdir "${cli.sourceDir}" --
          -b "${#isNotBlank(cli.changeRange) ? 'pr-' + cli.prNumber : 'scope'}-${#action.runID()}"
          -scan "${cli.sourceDir}"
          ${#isNotBlank(cli.changeRange) ? '--differential "' + cli.changeRange + '"' : ''}
          --ssc-appversion "${cli.appVersion}"
          ${#isNotBlank(cli.scope) ? '--scope "' + cli.scope + '"' : ''}
          ${#isNotBlank(cli.baseline) ? '--baseline "' + cli.baseline + '"' : ''}
          -o "${cli.faaOutput}"
          --output-format sarif,md-summary
          --output-md-summary "${cli.faaOutput}.md"
          --message-format plain
        stdout: collect
        stderr: collect
        on.success:
          - out.write:
              stdout: ${RUN_FAA_SCAN.stdout}
              stderr: ${RUN_FAA_SCAN.stderr}
        on.fail:
          - out.write:
              stdout: ${RUN_FAA_SCAN.stdout}
              stderr: ${RUN_FAA_SCAN.stderr}
          - throw: FAA Scan failed with errors.
      UPLOAD_SARIF:
        cmd: >
          fcli ssc artifact upload 
          --av "${cli.appVersion}" 
          --engine-type Fortify_AA 
          -f "${cli.faaOutput}"
          --store "${faaArtifactVarName}"
  
  - if: ${!cli.skipWait}
    run.fcli:
      WAIT: "fcli ssc artifact wait-for ::${faaArtifactVarName}::"